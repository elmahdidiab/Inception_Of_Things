apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>App 2 - Replica Cluster</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
            
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Space Grotesk', sans-serif;
                min-height: 100vh;
                background: #0a0a0a;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                overflow: hidden;
            }
            
            .grid {
                position: absolute;
                width: 100%;
                height: 100%;
                background-image: 
                    linear-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 255, 0, 0.1) 1px, transparent 1px);
                background-size: 50px 50px;
                animation: gridMove 20s linear infinite;
                perspective: 500px;
                transform-style: preserve-3d;
            }
            
            @keyframes gridMove {
                0% { transform: rotateX(45deg) translateY(0); }
                100% { transform: rotateX(45deg) translateY(50px); }
            }
            
            .neon-container {
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(5px);
                border: 2px solid #00ff00;
                border-radius: 15px;
                padding: 3rem 5rem;
                text-align: center;
                color: #00ff00;
                box-shadow: 0 0 30px rgba(0, 255, 0, 0.3),
                            inset 0 0 20px rgba(0, 255, 0, 0.1);
                position: relative;
                z-index: 2;
                max-width: 700px;
                margin: 2rem;
                animation: neonPulse 2s ease-in-out infinite;
            }
            
            @keyframes neonPulse {
                0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.1); }
                50% { box-shadow: 0 0 50px rgba(0, 255, 0, 0.5), inset 0 0 30px rgba(0, 255, 0, 0.2); }
            }
            
            h1 {
                font-size: 5rem;
                font-weight: 700;
                margin-bottom: 1rem;
                text-shadow: 0 0 10px #00ff00;
                letter-spacing: 5px;
            }
            
            .replica-badge {
                display: flex;
                justify-content: center;
                gap: 1rem;
                margin: 2rem 0;
            }
            
            .replica-dot {
                width: 60px;
                height: 60px;
                background: #00ff00;
                border-radius: 50%;
                animation: pulse 1.5s ease-in-out infinite;
                box-shadow: 0 0 20px #00ff00;
            }
            
            .replica-dot:nth-child(2) { animation-delay: 0.2s; }
            .replica-dot:nth-child(3) { animation-delay: 0.4s; }
            
            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 0.8; }
                50% { transform: scale(1.2); opacity: 1; }
            }
            
            .replica-text {
                font-size: 1.5rem;
                margin: 1rem 0 2rem;
                opacity: 0.9;
            }
            
            .highlight {
                font-size: 2rem;
                font-weight: 700;
                color: #fff;
                background: #00ff00;
                display: inline-block;
                padding: 0.5rem 2rem;
                border-radius: 50px;
                margin: 1rem 0;
                box-shadow: 0 0 30px #00ff00;
            }
            
            .matrix-rain {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 0, 0.1) 0px,
                    rgba(0, 0, 0, 0.5) 1px,
                    transparent 2px
                );
                animation: rain 10s linear infinite;
                pointer-events: none;
            }
            
            @keyframes rain {
                0% { transform: translateY(-100%); }
                100% { transform: translateY(100%); }
            }
            
            .status-bar {
                display: flex;
                justify-content: space-between;
                margin-top: 2rem;
                padding-top: 2rem;
                border-top: 1px solid rgba(0, 255, 0, 0.3);
                font-size: 0.9rem;
                text-transform: uppercase;
                letter-spacing: 2px;
            }
            
            .status-item {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .status-label {
                opacity: 0.6;
            }
            
            .status-value {
                font-weight: 700;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="grid"></div>
        <div class="matrix-rain"></div>
        
        <div class="neon-container">
            <h1>APP 2</h1>
            <div class="replica-badge">
                <div class="replica-dot"></div>
                <div class="replica-dot"></div>
                <div class="replica-dot"></div>
            </div>
            <div class="replica-text">3 Active Replicas</div>
            <div class="highlight">HIGH AVAILABILITY</div>
            
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-label">CPU</span>
                    <span class="status-value">42%</span>
                </div>
                <div class="status-item">
                    <span class="status-label">MEMORY</span>
                    <span class="status-value">3.2GB</span>
                </div>
                <div class="status-item">
                    <span class="status-label">NETWORK</span>
                    <span class="status-value">1.4Gbps</span>
                </div>
            </div>
        </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: app2-html
---
apiVersion: v1
kind: Service
metadata:
  name: app2-service
spec:
  selector:
    app: app2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80