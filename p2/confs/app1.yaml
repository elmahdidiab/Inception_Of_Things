apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>App 1 - Cloud Service</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
            
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Poppins', sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(-45deg, #4158D0, #C850C0, #FFCC70, #2193b0);
                background-size: 400% 400%;
                animation: gradient 15s ease infinite;
                position: relative;
                overflow: hidden;
            }
            
            @keyframes gradient {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }
            
            .glass-container {
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border-radius: 20px;
                border: 1px solid rgba(255, 255, 255, 0.18);
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
                padding: 3rem 5rem;
                text-align: center;
                color: white;
                transform: translateY(0);
                transition: transform 0.3s ease;
                z-index: 1;
                max-width: 600px;
                margin: 2rem;
            }
            
            .glass-container:hover {
                transform: translateY(-10px);
                box-shadow: 0 15px 45px 0 rgba(31, 38, 135, 0.5);
            }
            
            h1 {
                font-size: 4rem;
                font-weight: 700;
                margin-bottom: 1rem;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
                letter-spacing: 2px;
            }
            
            .badge {
                background: rgba(255, 255, 255, 0.25);
                border-radius: 50px;
                padding: 0.5rem 2rem;
                display: inline-block;
                margin-bottom: 2rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-size: 0.9rem;
                border: 1px solid rgba(255, 255, 255, 0.3);
            }
            
            p {
                font-size: 1.2rem;
                margin-bottom: 2rem;
                font-weight: 300;
                line-height: 1.6;
                opacity: 0.9;
            }
            
            .stats {
                display: flex;
                justify-content: space-around;
                margin-top: 2rem;
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                padding-top: 2rem;
            }
            
            .stat-item {
                text-align: center;
            }
            
            .stat-value {
                font-size: 1.8rem;
                font-weight: 700;
                display: block;
            }
            
            .stat-label {
                font-size: 0.8rem;
                text-transform: uppercase;
                opacity: 0.7;
                letter-spacing: 1px;
            }
            
            .float-animation {
                position: absolute;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                z-index: 0;
            }
            
            .float-circle {
                position: absolute;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                animation: float 8s infinite;
            }
            
            @keyframes float {
                0%, 100% { transform: translateY(0) translateX(0); }
                25% { transform: translateY(-30px) translateX(20px); }
                50% { transform: translateY(10px) translateX(-20px); }
                75% { transform: translateY(20px) translateX(30px); }
            }
            
            .circle1 {
                width: 200px;
                height: 200px;
                top: -50px;
                left: -50px;
            }
            
            .circle2 {
                width: 300px;
                height: 300px;
                bottom: -100px;
                right: -50px;
                animation-duration: 12s;
            }
            
            .circle3 {
                width: 150px;
                height: 150px;
                bottom: 50px;
                left: 30%;
                animation-duration: 10s;
            }
        </style>
    </head>
    <body>
        <div class="float-animation">
            <div class="float-circle circle1"></div>
            <div class="float-circle circle2"></div>
            <div class="float-circle circle3"></div>
        </div>
        
        <div class="glass-container">
            <div class="badge">🚀 Primary Service</div>
            <h1>APP 1</h1>
            <p>Experience the future of cloud computing with our next-generation infrastructure. Blazing fast, reliable, and secure.</p>
            
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value">99.9%</span>
                    <span class="stat-label">Uptime</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">1ms</span>
                    <span class="stat-label">Latency</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">∞</span>
                    <span class="stat-label">Scale</span>
                </div>
            </div>
        </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: app1-html
---
apiVersion: v1
kind: Service
metadata:
  name: app1-service
spec:
  selector:
    app: app1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80